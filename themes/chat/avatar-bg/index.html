<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ReChat Widget - Avatar Backdrop Theme</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/widget/assets/avatar-bg/style.css">
</head>
<body>
  <div id="chat"></div>

  <script>
    const CHAT = document.getElementById('chat');
    const MAX_MESSAGES = 40;
    const recentRewards = new Set();

    // Built-in static fallback badges (Twitch standard)
    const STATIC_BADGES = {
      'broadcaster/1': 'https://static-cdn.jtvnw.net/badges/v1/5527c58c-fb7d-422d-b71b-f309dcb85cc1/1',
      'moderator/1': 'https://static-cdn.jtvnw.net/badges/v1/3267646d-33f0-4b17-b3df-f923a41db1d0/1',
      'vip/1': 'https://static-cdn.jtvnw.net/badges/v1/b817aba4-fad8-49e2-b88a-7cc744dfa6ec/1',
      'subscriber/0': 'https://static-cdn.jtvnw.net/badges/v1/5d9f2208-5dd8-11e7-8513-2aa4b878e69d/1',
      'subscriber/1': 'https://static-cdn.jtvnw.net/badges/v1/5d9f2208-5dd8-11e7-8513-2aa4b878e69d/1',
      'partner/1': 'https://static-cdn.jtvnw.net/badges/v1/d12a2e27-16f6-41d0-ab77-b780518f00a3/1',
      'premium/1': 'https://static-cdn.jtvnw.net/badges/v1/bbbe0db0-a998-4c63-8bc5-eb07a378127a/1',
      'turbo/1': 'https://static-cdn.jtvnw.net/badges/v1/bd444ec6-8f34-4bf9-abac-f6c23f00388c/1',
      'artist-badge/1': 'https://static-cdn.jtvnw.net/badges/v1/430072bc-1e8d-4527-ba13-a00a44a6e824/1',
      'founder/0': 'https://static-cdn.jtvnw.net/badges/v1/09d93036-e7ce-431c-9a9e-704429714143/1',
      'sub-gifter/1': 'https://static-cdn.jtvnw.net/badges/v1/f1d2c676-e1f4-411a-8c46-ca047eb4d807/1'
    };

    // Common global emotes fallbacks (Twitch + 7TV + BTTV + FFZ)
    const COMMON_EMOTES = {
      'Kappa': 'https://static-cdn.jtvnw.net/emoticons/v2/25/default/dark/1.0',
      'LUL': 'https://static-cdn.jtvnw.net/emoticons/v2/425618/default/dark/1.0',
      'PogChamp': 'https://static-cdn.jtvnw.net/emoticons/v2/305954156/default/dark/1.0',
      'BibleThump': 'https://static-cdn.jtvnw.net/emoticons/v2/86/default/dark/1.0',
      'Kreygasm': 'https://static-cdn.jtvnw.net/emoticons/v2/41/default/dark/1.0',
      'ResidentSleeper': 'https://static-cdn.jtvnw.net/emoticons/v2/245/default/dark/1.0',
      'WutFace': 'https://static-cdn.jtvnw.net/emoticons/v2/28087/default/dark/1.0',
      'HeyGuys': 'https://static-cdn.jtvnw.net/emoticons/v2/30259/default/dark/1.0',
      'VoHiYo': 'https://static-cdn.jtvnw.net/emoticons/v2/81274/default/dark/1.0',
      'TriHard': 'https://static-cdn.jtvnw.net/emoticons/v2/120232/default/dark/1.0',
      'CoolCat': 'https://static-cdn.jtvnw.net/emoticons/v2/58127/default/dark/1.0',
      'BleedPurple': 'https://static-cdn.jtvnw.net/emoticons/v2/62835/default/dark/1.0',
      'FrankerZ': 'https://static-cdn.jtvnw.net/emoticons/v2/50/default/dark/1.0',
      'NotLikeThis': 'https://static-cdn.jtvnw.net/emoticons/v2/58765/default/dark/1.0',
      'FailFish': 'https://static-cdn.jtvnw.net/emoticons/v2/360/default/dark/1.0',
      'KEKW': 'https://cdn.betterttv.net/emote/5e9c6c187e090362f8b0b9e8/1x.webp',
      'monkaS': 'https://cdn.betterttv.net/emote/56e9f494fff3cc5c35e5287e/1x.webp',
      'catJAM': 'https://cdn.betterttv.net/emote/5f1b0186cf6d2144653d2970/1x.webp',
      'PepeLaugh': 'https://cdn.betterttv.net/emote/5c548025009a2a73211870be/1x.webp',
      'OMEGALUL': 'https://cdn.betterttv.net/emote/5830e6ec47a7a8141433e4b8/1x.webp',
      'Pog': 'https://cdn.betterttv.net/emote/5ff8373327d42b47426173da/1x.webp',
      'Sadge': 'https://cdn.betterttv.net/emote/5e0fa9d40550d42106b8a489/1x.webp',
      'AYAYA': 'https://cdn.betterttv.net/emote/58493d92560ae403713824c0/1x.webp',
      'GIGACHAD': 'https://cdn.7tv.app/emote/609d57a26f3e5898d90f230b/1x.webp'
    };

    let globalBadges = { ...STATIC_BADGES };
    let globalEmotes = { ...COMMON_EMOTES };

    // Fetch live badges map from backend
    fetch('/widget/badges')
      .then(r => r.json())
      .then(data => {
        if (data && typeof data === 'object') {
          globalBadges = { ...globalBadges, ...data };
        }
      })
      .catch(() => {});

    // Fetch live 7TV / BTTV / FFZ channel emotes map from backend
    fetch('/widget/emotes')
      .then(r => r.json())
      .then(data => {
        if (data && typeof data === 'object') {
          globalEmotes = { ...globalEmotes, ...data };
        }
      })
      .catch(() => {});

    // SSE connection to ReChat widget server
    function connectSSE() {
      const es = new EventSource('/widget/events');

      es.addEventListener('message', (e) => {
        try {
          const msg = JSON.parse(e.data);
          if (msg.type === 'clear') {
            CHAT.innerHTML = '';
            return;
          }
          addMessage(msg);
        } catch (err) {
          console.error('Failed to parse chat message:', err);
        }
      });

      es.addEventListener('reload', () => location.reload());

      // Real-time avatar update when fetched from Twitch Helix API
      es.addEventListener('avatar_update', (e) => {
        try {
          const data = JSON.parse(e.data);
          if (!data.user || !data.avatarUrl) return;
          const target = data.user.toLowerCase();
          document.querySelectorAll('[data-author="' + target + '"]').forEach((row) => {
            const bg = row.querySelector('.card-avatar-bg');
            if (bg) {
              bg.style.backgroundImage = 'url("' + data.avatarUrl + '")';
              bg.classList.remove('is-template');
              bg.classList.add('has-image');
            }
          });
        } catch (err) {
          console.error('Avatar update error:', err);
        }
      });

      es.onerror = () => {
        es.close();
        setTimeout(connectSSE, 3000);
      };
    }

    connectSSE();

    function addMessage(msg) {
      if (msg.type === 'reward') {
        const dedupKey = (msg.author || '').toLowerCase() + ':' + (msg.userInput || '');
        if (recentRewards.has(dedupKey)) return;
        recentRewards.add(dedupKey);
        setTimeout(() => recentRewards.delete(dedupKey), 15000);
      }

      const el = document.createElement('div');
      const author = msg.author || 'Аноним';
      const authorLower = author.toLowerCase();
      el.setAttribute('data-author', authorLower);

      const color = msg.color || avatarColor(author);
      const fallbackColor = avatarColor(author);
      const isFirstMsg = Boolean(msg.isFirstMsg);
      // Show avatar if URL is present, regardless of isFirstMsg
      // Only fall back to template when there is no avatar URL at all
      const hasAvatar = msg.avatarUrl && msg.avatarUrl.trim().length > 0;

      // Template background if first-time chatter or avatar not loaded
      let bgClass = 'card-avatar-bg';
      let bgStyle = '';
      if (hasAvatar) {
        bgClass += ' has-image';
        bgStyle = 'background-image: url(\'' + escHtml(msg.avatarUrl) + '\'); background-color: ' + fallbackColor + ';';
      } else {
        bgClass += ' is-template';
        bgStyle = '--user-color: ' + fallbackColor + '; background-color: ' + fallbackColor + ';';
      }

      // Emotes parsing
      const renderedText = parseEmotes(msg.text || '', msg.emoteMap);

      if (msg.type === 'reward') {
        // Channel Points Reward Card
        el.className = 'row reward-row';
        const costHtml = msg.cost
          ? '<span class="reward-cost">' + formatNum(msg.cost) + '</span>'
          : '';
        const inputHtml = msg.userInput
          ? '<div class="reward-input">"' + parseEmotes(msg.userInput, msg.emoteMap) + '"</div>'
          : '';

        el.innerHTML =
          '<div class="msg-card reward-card" style="--user-color:#a855f7">' +
            '<div class="' + bgClass + '" style="' + bgStyle + '">' +
              '<div class="template-avatar-stamp">' + initial(author) + '</div>' +
            '</div>' +
            '<div class="card-gradient-overlay reward-overlay"></div>' +
            '<div class="card-content">' +
              '<div class="reward-header">' +
                '<div class="reward-crown">' +
                  '<svg width="13" height="13" viewBox="0 0 20 20" fill="currentColor"><path d="M2 14l2-8 4 4 2-6 2 6 4-4 2 8H2z"/></svg>' +
                '</div>' +
                '<span class="reward-title">' + escHtml(msg.rewardTitle || 'Награда') + '</span>' +
                costHtml +
              '</div>' +
              '<div class="reward-meta">' +
                '<span class="reward-author" style="color:' + color + '">' + escHtml(author) + '</span>' +
                '<span class="reward-verb">использовал награду</span>' +
              '</div>' +
              inputHtml +
            '</div>' +
          '</div>';
      } else {
        // Standard Chat Message Card with Avatar / Template Backdrop
        el.className = 'row message-row';
        const firstMsgBadge = isFirstMsg
          ? '<span class="badge-first-msg">★ ПЕРВОЕ СООБЩЕНИЕ</span>'
          : '';

        el.innerHTML =
          '<div class="msg-card" style="--user-color:' + color + '">' +
            '<div class="' + bgClass + '" style="' + bgStyle + '">' +
              '<div class="template-avatar-stamp">' + initial(author) + '</div>' +
            '</div>' +
            '<div class="card-gradient-overlay"></div>' +
            '<div class="card-content">' +
              '<div class="msg-header">' +
                renderBadges(msg.badges, msg.badgeUrls) +
                '<span class="msg-author" style="color:' + color + '">' + escHtml(author) + '</span>' +
                firstMsgBadge +
                (msg.timestamp ? '<span class="msg-time">' + escHtml(msg.timestamp) + '</span>' : '') +
              '</div>' +
              '<div class="msg-text">' + renderedText + '</div>' +
            '</div>' +
          '</div>';
      }

      CHAT.appendChild(el);
      requestAnimationFrame(() => requestAnimationFrame(() => el.classList.add('visible')));

      while (CHAT.children.length > MAX_MESSAGES) {
        const old = CHAT.firstChild;
        old.classList.add('removing');
        setTimeout(() => { if (old.parentNode) old.remove(); }, 300);
        break;
      }
    }

    // Render Badge Image Icons with dynamic and static fallbacks
    function renderBadges(badges, badgeUrls) {
      if ((!badges || badges.length === 0) && (!badgeUrls || badgeUrls.length === 0)) return '';
      
      const badgeList = badges || [];
      const urlsList = badgeUrls || [];

      let html = '<span class="badges-row">';

      // 1. If direct URLs provided
      if (urlsList.length > 0) {
        for (let i = 0; i < urlsList.length; i++) {
          const url = urlsList[i];
          const label = badgeList[i] || 'badge';
          html += '<img class="badge-icon" src="' + escHtml(url) + '" alt="' + escHtml(label) + '" title="' + escHtml(label) + '" onerror="this.remove()" />';
        }
        html += '</span>';
        return html;
      }

      // 2. Resolve from badge tags (e.g. "broadcaster/1", "moderator/1")
      for (let i = 0; i < badgeList.length; i++) {
        const tag = badgeList[i];
        const [badgeName, version] = tag.split('/');
        const url = globalBadges[tag] || STATIC_BADGES[tag] || globalBadges[badgeName + '/1'] || STATIC_BADGES[badgeName + '/1'];

        if (url) {
          html += '<img class="badge-icon" src="' + escHtml(url) + '" alt="' + escHtml(tag) + '" title="' + escHtml(tag) + '" onerror="this.remove()" />';
        } else {
          // Text pill fallback
          html += '<span class="badge-pill badge-' + escHtml(badgeName) + '">' + escHtml(badgeName.slice(0, 3).toUpperCase()) + '</span>';
        }
      }

      html += '</span>';
      return html;
    }

    // Emote Parser: converts emote codes to <img> tags (supports native Twitch + 7TV + BTTV + FFZ)
    function parseEmotes(text, msgEmoteMap) {
      if (!text) return '';
      const activeEmotes = { ...COMMON_EMOTES, ...globalEmotes, ...(msgEmoteMap || {}) };
      const words = text.split(/\s+/);

      return words.map((word) => {
        if (!word) return '';

        let cleanWord = word;
        let trailingPunct = '';

        // Handle trailing punctuation like "Kappa!", "catJAM,"
        const match = word.match(/^(.+?)([.,!?;:)]+)$/);
        if (match) {
          cleanWord = match[1];
          trailingPunct = match[2];
        }

        const url = activeEmotes[cleanWord] || activeEmotes[word];
        const targetWord = activeEmotes[cleanWord] ? cleanWord : word;
        const punct = activeEmotes[cleanWord] ? escHtml(trailingPunct) : '';

        if (url) {
          let src = url;
          if (src.startsWith('//')) src = 'https:' + src;
          return '<span class="emote-wrapper"><img class="chat-emote" src="' + escHtml(src) + '" alt="' + escHtml(targetWord) + '" title="' + escHtml(targetWord) + '" loading="lazy" />' + punct + '</span>';
        }

        return escHtml(word);
      }).join(' ');
    }

    function escHtml(s) {
      return (s || '')
        .replace(/&/g, '&amp;').replace(/</g, '&lt;')
        .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    function initial(name) {
      return (name || '?').charAt(0).toUpperCase();
    }

    function formatNum(n) {
      return n >= 1000 ? (n / 1000).toFixed(n % 1000 === 0 ? 0 : 1) + 'K' : String(n);
    }

    function avatarColor(name) {
      const palette = ['#6366f1', '#8b5cf6', '#ec4899', '#14b8a6', '#f59e0b', '#3b82f6', '#10b981', '#f43f5e', '#06b6d4'];
      let h = 0;
      for (let i = 0; i < (name || '').length; i++) {
        h = (h * 31 + name.charCodeAt(i)) & 0xffffffff;
      }
      return palette[Math.abs(h) % palette.length];
    }

    // Test simulator: press T
    function sendDemoMessage() {
      const sampleUsers = [
        { name: 'Or1ggin', pic: '', isFirst: false, color: '#9ACD32', badges: ['broadcaster/1', 'subscriber/12'] },
        { name: 'CyberSamurai', pic: 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=150&auto=format&fit=crop&q=80', isFirst: false, color: '#ff4f4d', badges: ['moderator/1'] },
        { name: 'NewbieViewer', pic: '', isFirst: true, color: '#38bdf8', badges: [] },
        { name: 'catLover', pic: 'https://images.unsplash.com/photo-1517841905240-472988babdf9?w=150&auto=format&fit=crop&q=80', isFirst: false, color: '#00ffc4', badges: ['vip/1'] }
      ];
      const sampleTexts = [
        'Всем привет Kappa и отличного стрима catJAM PogChamp',
        'Мое первое сообщение в чате! Всем добрый вечер ✨',
        'Какой билд используешь? Выглядит мощно KEKW LUL',
        'Этот оверлей с эмоутами и баджами просто бомба catJAM'
      ];

      const u = sampleUsers[Math.floor(Math.random() * sampleUsers.length)];
      const t = sampleTexts[Math.floor(Math.random() * sampleTexts.length)];
      const isReward = Math.random() < 0.2;

      addMessage({
        type: isReward ? 'reward' : 'message',
        author: u.name,
        avatarUrl: u.pic,
        color: u.color,
        text: t,
        badges: u.badges,
        isFirstMsg: u.isFirst,
        timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
        rewardTitle: 'Выделить сообщение',
        cost: 250,
        userInput: isReward ? 'Лови награду от души! catJAM' : ''
      });
    }

    window.addEventListener('keydown', (e) => {
      if (e.key === 't' || e.key === 'T') sendDemoMessage();
    });

    if (new URLSearchParams(location.search).get('test') === '1') {
      sendDemoMessage();
      setInterval(sendDemoMessage, 3000);
    }
  </script>
</body>
</html>
